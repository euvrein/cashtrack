<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../css/main.css" rel="stylesheet">
</head>
<body>
    <div class="card-section">      
      <div class="card-container">
        <div class="card">
          <div class="card-face card-front">
            <div>
              <div class="card-chip"></div>
              <div class="card-number tooltip">
                •••• •••• •••• 4587
                <span class="tooltip-text">Masked for security. Click to view full card details.</span>
              </div>
            </div>
            <div class="card-details">
              <div class="card-holder">
                <span class="detail-label">Card Holder</span>
                <span class="detail-value">Sample Card</span>
              </div>
              <div class="card-expires">
                <span class="detail-label">Expires</span>
                <span class="detail-value">12/34</span>
              </div>
              <div class="card-type">Cash</div>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="magnetic-strip"></div>
            <div class="signature">
              <span class="signature-text"></span>
            </div>
            <div class="cvv tooltip">
              <span class="detail-label">CVV</span>
              <span class="detail-value">256</span>
              <span class="tooltip-text">Your 3-digit security code on the back of your card. Used for online purchases.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
      <script src="../js/jquery.min.js"></script>
  <script src="../js/home.js"></script>
</body>
</html>
