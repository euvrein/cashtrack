<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../css/main.css" rel="stylesheet">
  <link href="../css/custom.css" rel="stylesheet">
</head>
<body id="summary-of-transactions">

<div id="amend_transaction_display" style="display: none;">
  <header class="stat-title header-title">Amend Transaction Details</header>
  <hr />
  <div class="divider-20"></div>
  
  <form id="amendment_form">
    <table class="center-align">
      <tr class="form-fields" style="display: none;">
        <td>
          <label class="form-label">Index</label>
        </td>
        <td>
          <input id="transaction-index" type="number" class="form-input" required/>
        </td>
      </tr>
      <tr class="form-fields">
        <td>
          <label class="form-label">Description</label>
        </td>
        <td>
          <input id="transaction-description" type="text" maxlength="18" class="form-input" required/>
        </td>
      </tr>
      <tr class="form-fields">
        <td>
          <label class="form-label">Date</label>
        </td>
        <td>
          <input id="transaction-date" type="date" class="form-input" required/>
        </td>
      </tr>
      <tr class="form-fields">
        <td>
          <label class="form-label">Amount</label>
        </td>
        <td>
          <input id="transaction-amount" type="number" step="0.01" min="0" class="form-input" required/>
        </td>
      </tr>
      <tr class="form-fields">
        <td>
          <label class="form-label">Type</label>
        </td>
        <td>
          <select id="transaction-type" class="form-input" required>
            <option value="spending">spending</option>
            <option value="earnings">earnings</option>
          </select>
        </td>
      </tr>
    </table>
    
    <div class="divider-20"></div>
    <div class="center-align">
      <button class="btn btn-success" type="submit">Confirm</button>
    </div>
  </form>
  
  <div class="divider-10"></div>
  <div class="center-align">
    <button id="btn_delete_transaction" class="btn btn-error">Delete</button>
  </div>
  <div class="divider-10"></div>
  <div class="center-align">
    <button class="btn btn-dark" onClick="cancel_amendment()">Cancel</button>
  </div>
</div>


<div id="summary_list">
  <div id="printable_area">
    <header class="stat-title header-title"><h3>Summary of Transactions</h3></header>
    <div class="divider-20"></div>
    
    <div id="transaction-summary" class="transaction-summary"></div>
  </div>

  <footer class="nav-footer">
    <div class="center-align">
      <button class="btn btn-accent" onclick="print_transaction()">Print</button>
    </div>

    <div class="divider-10"></div>
    <div class="center-align">
      <button class="btn btn-dark" onclick="goto_page('./home.html')">Back</button>
    </div>  
  </footer>
</div>






  <script src="../js/jquery.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/transaction.js"></script>
  <script src="../js/navigation.js"></script>

  <script src="../js/transaction_summary.js"></script>

</body>
</html>
