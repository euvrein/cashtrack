<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../css/main.css" rel="stylesheet">
  <link href="../css/custom.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
          <h1 class="dashboard-title">CashTrack</h1>
    </div>

    <div>
      <span class="stat-title">Update Spending Limits</span>
    </div>
    <form id="spending_limit_form">
      <table class="center-align">
        <tr class="form-fields">
          <td>
            <label class="form-label">Spending Limit</label>
          </td>
          <td>
            <input id="spending-limit-amount" type="number" step="0.01" class="form-input"/>
          </td>
        </tr>
      </table>

      <div class="divider-20"></div>
      <div class="center-align">
        <button class="btn btn-success" type="submit">Confirm</button>
      </div>
    </form>
    
    <div class="divider-10"></div>
    <div class="center-align">
      <button class="btn btn-dark" onclick="goto_page('./home.html')">Back</button>
    </div>

  </div>

  <script src="../js/jquery.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/crud_transaction.js"></script>
  <script src="../js/navigation.js"></script>

  <script src="../js/spending_limits.js"></script>

</body>
</html>
